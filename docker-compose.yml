services:
  # CPU-only deployment (default)
  parakeet-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: parakeet-tdt:cpu
    container_name: parakeet-cpu
    ports:
      - "5092:5092"
    volumes:
      - parakeet-models:/app/models
    environment:
      - API_KEY=${API_KEY:?API_KEY is required}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://localhost:5092/health', headers={'Authorization': 'Bearer ' + os.environ.get('API_KEY', '')}); urllib.request.urlopen(req)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # GPU deployment (requires NVIDIA Container Toolkit)
  parakeet-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: parakeet-tdt:gpu
    container_name: parakeet-gpu
    ports:
      - "5092:5092"
    volumes:
      - parakeet-models:/app/models
    environment:
      - API_KEY=${API_KEY:?API_KEY is required}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, urllib.request; req = urllib.request.Request('http://localhost:5092/health', headers={'Authorization': 'Bearer ' + os.environ.get('API_KEY', '')}); urllib.request.urlopen(req)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  parakeet-models:
    name: parakeet-models
